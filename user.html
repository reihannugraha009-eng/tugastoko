
<script>
        let keranjang = [];
        let riwayatPesanan = []; 

        // ====== FUNGSI UNTUK MEMUNCULKAN PRODUK ======
        function muatKatalogProduk() {
            let dbProduk = JSON.parse(localStorage.getItem('dataProdukGadgetStore'));
            const katalogGrid = document.getElementById('katalog-grid');
            
            // Jika data belum ada, atau kebetulan isinya cuma 3 (karena kodingan sebelumnya), kita kembalikan ke 6 produk asli!
            if (!dbProduk || dbProduk.length <= 3) {
                dbProduk = [
                    {
                        nama: "Xiaomi 17T",
                        harga: 8500000,
                        deskripsi: "Performa gahar dengan kamera Leica. Cocok untuk fotografi profesional dan gaming berat dengan harga terjangkau.",
                        gambar: "Screenshot 2026-08-11 123218.png",
                        video: "https://www.youtube.com/embed/IPl-yBvP79U"
                    },
                    {
                        nama: "Samsung Galaxy S26 Ultra",
                        harga: 22000000,
                        deskripsi: "HP Flagship terbaik dengan S-Pen dan teknologi AI canggih. Layar Dynamic AMOLED dan kamera superior.",
                        gambar: "Screenshot 2026-08-11 123433.png",
                        video: "https://www.youtube.com/embed/q7Ura_0SwA0"
                    },
                    {
                        nama: "Apple iPhone 17",
                        harga: 16500000,
                        deskripsi: "Generasi terbaru iPhone dengan performa chipset ngebut, desain elegan, dan integrasi ekosistem Apple yang mulus.",
                        gambar: "Screenshot 2026-08-11 123311.png",
                        video: "https://www.youtube.com/embed/rkLpVyRGCPw"
                    },
                    {
                        nama: "Vivo X300 Pro",
                        harga: 14000000,
                        deskripsi: "Perdana dengan Dimensity 9500. Sangat cocok untuk kamu yang mencari hasil jepretan kamera setara DSLR.",
                        gambar: "Screenshot 2026-08-11 123240.png",
                        video: "https://www.youtube.com/embed/-I2STJrgxcA"
                    },
                    {
                        nama: "POCO X8 Pro Max",
                        harga: 6000000,
                        deskripsi: "Raja performa kelas menengah. Dilengkapi baterai 8500mAh dan HyperCharge 100W, bikin mabar makin lancar.",
                        gambar: "Screenshot 2026-08-11 120704.png",
                        video: "https://www.youtube.com/embed/oM9v6P41tRA"
                    },
                    {
                        nama: "ROG Zephyrus DUO",
                        harga: 130000000,
                        deskripsi: "IN THIS ECONOMY!!??",
                        gambar: "Screenshot 2026-08-11 141250.png",
                        video: "https://www.youtube.com/embed/DSZE5C_I9xE"
                    }
                ];
                // Simpan ulang ke penyimpanan browser
                localStorage.setItem('dataProdukGadgetStore', JSON.stringify(dbProduk));
            }

            // Bersihkan area grid
            katalogGrid.innerHTML = '';

            // Render semua produk ke dalam HTML
            dbProduk.forEach(produk => {
                const htmlProduk = `
                    <div class="kartu-produk">
                        <img src="${produk.gambar}" alt="${produk.nama}">
                        <h3>${produk.nama}</h3>
                        <div class="harga">${formatRupiah(produk.harga)}</div>
                        <div class="deskripsi">${produk.deskripsi}</div>
                        <iframe src="${produk.video}" allowfullscreen></iframe>
                        <button class="btn-beli" onclick="addToCart('${produk.nama}', ${produk.harga})">🛒 Beli Sekarang</button>
                    </div>
                `;
                katalogGrid.innerHTML += htmlProduk;
            });
        }

        // Jalankan saat halaman dibuka
        window.onload = muatKatalogProduk;

        // ====== FUNGSI KERANJANG & CHECKOUT ======
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }
        function formatRupiah(angka) { return "Rp " + angka.toLocaleString('id-ID'); }
        function buatIDInvoice() { return "INV-" + Math.floor(Math.random() * 900000 + 100000); }

        function addToCart(namaProduk, hargaProduk) {
            keranjang.push({ nama: namaProduk, harga: hargaProduk });
            updateKeranjang();
            const cartIcon = document.getElementById('cart-count');
            cartIcon.style.transform = "scale(1.5)";
            setTimeout(() => cartIcon.style.transform = "scale(1)", 200);
        }

        function hapusItem(index) { keranjang.splice(index, 1); updateKeranjang(); }

        function updateKeranjang() {
            document.getElementById('cart-count').innerText = keranjang.length;
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = ''; 
            let total = 0;
            
            if (keranjang.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color:#94a3b8; text-align:center;">Keranjang kosong.</p>';
            } else {
                keranjang.forEach((item, index) => {
                    total += item.harga;
                    cartItemsDiv.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <strong>${item.nama}</strong><br>
                                <button class="btn-hapus-item" onclick="hapusItem(${index})">🗑️ Hapus</button>
                            </div>
                            <span>${formatRupiah(item.harga)}</span>
                        </div>
                    `;
                });
            }
            document.getElementById('total-price').innerText = formatRupiah(total);
        }

        function prosesPesanan() {
            if (keranjang.length === 0) { alert("Keranjang masih kosong."); return; }
            const nama = document.getElementById('nama').value;
            const nowa = document.getElementById('nowa').value;
            const alamat = document.getElementById('alamat').value;
            const metode = document.getElementById('metode').value;
            
            if(!nama || !nowa || !alamat || !metode) { alert("Lengkapi data checkout!"); return; }
            
            const totalHarga = document.getElementById('total-price').innerText;
            const listProdukDibeli = keranjang.map(item => item.nama).join(', ');
            
            riwayatPesanan.unshift({
                id: buatIDInvoice(), namaPembeli: nama, noWa: nowa, alamatTujuan: alamat, produk: listProdukDibeli, total: totalHarga, status: "Menunggu Konfirmasi"
            });
            
            document.getElementById('pesan-sukses-detail').innerHTML = `Terima kasih <b>${nama}</b>! <br> Pesanan senilai <b>${totalHarga}</b> menggunakan metode <b>${metode}</b> sedang diproses.`;
            document.getElementById('modal-sukses').style.display = 'flex';
            
            keranjang = [];
            document.getElementById('nama').value = ''; document.getElementById('nowa').value = '';
            document.getElementById('alamat').value = ''; document.getElementById('metode').value = '';
            updateKeranjang(); document.getElementById('cart-sidebar').classList.remove('active'); 
        }

        function tutupModalSukses() { document.getElementById('modal-sukses').style.display = 'none'; }
        function tutupRiwayat() { document.getElementById('modal-riwayat').style.display = 'none'; }

        function bukaRiwayat() {
            const containerRiwayat = document.getElementById('container-list-riwayat');
            containerRiwayat.innerHTML = ''; 
            if(riwayatPesanan.length === 0) {
                containerRiwayat.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 20px 0;">Belum ada riwayat pesanan.</p>';
            } else {
                riwayatPesanan.forEach(order => {
                    containerRiwayat.innerHTML += `
                        <div class="kartu-riwayat">
                            <div class="riwayat-top"><span class="riwayat-id">ID: ${order.id}</span><span class="riwayat-status">${order.status}</span></div>
                            <div class="riwayat-detail">
                                <p><strong>Penerima:</strong> ${order.namaPembeli} (${order.noWa})</p>
                                <p><strong>Alamat:</strong> ${order.alamatTujuan}</p>
                                <p><strong>Produk:</strong> ${order.produk}</p>
                                <p><strong>Total:</strong> <span style="color:#ef4444; font-weight:bold;">${order.total}</span></p>
                            </div>
                        </div>`;
                });
            }
            document.getElementById('modal-riwayat').style.display = 'flex';
        }
    </script>
