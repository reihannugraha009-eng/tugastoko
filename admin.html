<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - GadgetStore</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
        .back-btn:hover { text-decoration: underline; }
        
        .kartu-pembatas {
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 30px 40px;
        }
        .kartu-pembatas h2 {
            margin-top: 0;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            color: #475569;
            display: block;
            margin-top: 15px;
        }
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            margin-top: 30px;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background-color: #059669; }
    </style>
</head>
<body>
    <header>
        <h1>GadgetStore System</h1>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn">⬅ Kembali ke Menu Utama</a>

        <div class="kartu-pembatas">
            <h2>Area Kerja Admin</h2>
            <p style="color: #64748b;">Gunakan formulir ini untuk menambahkan inventaris produk baru.</p>
            
            <form id="formProduk">
                <label>Nama Produk:</label>
                <input type="text" id="nama" placeholder="Contoh: Laptop UltraBook Pro" required>

                <label>Harga Produk (Rp):</label>
                <input type="number" id="harga" placeholder="Contoh: 15000000" required>

                <label>Deskripsi Produk:</label>
                <textarea id="deskripsi" rows="4" placeholder="Masukkan deskripsi spesifikasi..." required></textarea>

                <label>URL Gambar Produk:</label>
                <input type="text" id="gambar" placeholder="https://contoh-link-gambar.com/foto.jpg" required>

                <label>URL Video Produk:</label>
                <input type="text" id="video" placeholder="Contoh: https://www.youtube.com/embed/xxxx">

                <button type="button" onclick="simpanProduk()">Simpan Produk ke Database</button>
            </form>
        </div>
    </div>

    <!-- Script JavaScript untuk menyimpan data ke Local Storage -->
    <script>
        function simpanProduk() {
            // Mengambil nilai dari setiap kolom input
            const nama = document.getElementById('nama').value;
            const harga = document.getElementById('harga').value;
            const deskripsi = document.getElementById('deskripsi').value;
            const gambar = document.getElementById('gambar').value;
            const video = document.getElementById('video').value;

            // Memastikan kolom wajib tidak kosong
            if(!nama || !harga || !deskripsi || !gambar) {
                alert("Mohon lengkapi semua data produk (kecuali video boleh kosong).");
                return;
            }

            // Membuat objek produk baru
            const produkBaru = {
                nama: nama,
                harga: harga,
                deskripsi: deskripsi,
                gambar: gambar,
                video: video
            };

            // Mengambil data produk lama dari local storage (jika ada)
            let produkList = JSON.parse(localStorage.getItem('dataProduk')) || [];
            
            // Menambahkan produk baru ke dalam daftar
            produkList.push(produkBaru);

            // Menyimpan kembali ke local storage
            localStorage.setItem('dataProduk', JSON.stringify(produkList));

            alert('Produk berhasil disimpan! Cek file user.html untuk melihat hasilnya.');
            
            // Mengosongkan form setelah disimpan
            document.getElementById('formProduk').reset();
        }
    </script>
</body>
</html>
