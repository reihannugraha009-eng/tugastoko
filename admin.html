<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin - GadgetStore System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0; padding: 0; color: #333;
        }
        header {
            background: #0f172a; color: white; text-align: center; padding: 20px 0; margin-bottom: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 40px 20px; }
        
        .back-btn {
            display: inline-block; color: #2563eb; text-decoration: none;
            font-weight: bold; margin-bottom: 20px; font-size: 14px;
        }
        .back-btn:hover { text-decoration: underline; }
        
        .card {
            background: white; border-radius: 12px; padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        .card h2 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        
        /* Form Styles */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; color: #334155; margin-bottom: 8px; font-size: 14px;}
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1;
            border-radius: 6px; box-sizing: border-box; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-submit {
            background-color: #22c55e; color: white; font-weight: bold; font-size: 16px;
            padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s;
        }
        .btn-submit:hover { background-color: #16a34a; }
        
        /* Pesanan Styles */
        .pesanan-card {
            border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px;
            margin-bottom: 15px; background: #f8fafc;
        }
        .pesanan-header {
            display: flex; justify-content: space-between; border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 10px; margin-bottom: 10px;
        }
        .btn-konfirmasi {
            background-color: #22c55e; color: white; border: none; padding: 8px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .btn-konfirmasi:hover { background-color: #16a34a; }
        .status-ok { color: #166534; font-weight: bold; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>GadgetStore System</h1>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn">⬅ Kembali ke Menu Utama</a>
        
        <!-- BAGIAN 1: FORM TAMBAH PRODUK -->
        <div class="card">
            <h2>Area Kerja Admin</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Gunakan formulir ini untuk menambahkan inventaris produk baru.</p>
            
            <div class="form-group">
                <label>Nama Produk:</label>
                <input type="text" id="admin-nama" placeholder="Contoh: Laptop UltraBook Pro">
            </div>
            
            <div class="form-group">
                <label>Harga Produk (Rp):</label>
                <input type="number" id="admin-harga" placeholder="Contoh: 15000000">
            </div>
            
            <div class="form-group">
                <label>Deskripsi Produk:</label>
                <textarea id="admin-deskripsi" rows="3" placeholder="Masukkan deskripsi spesifikasi..."></textarea>
            </div>
            
            <div class="form-group">
                <label>URL Gambar Produk:</label>
                <input type="text" id="admin-gambar" placeholder="https://contoh-link-gambar.com/foto.jpg">
            </div>
            
            <div class="form-group">
                <label>URL Video Produk:</label>
                <input type="text" id="admin-video" placeholder="Contoh: https://www.youtube.com/embed/xxxx">
            </div>
            
            <button class="btn-submit" onclick="simpanProduk()">Simpan Produk ke Database</button>
        </div>

        <!-- BAGIAN 2: MANAJEMEN PESANAN MASUK -->
        <div class="card">
            <h2>📦 Manajemen Pesanan Masuk</h2>
            <div id="list-pesanan-admin" style="margin-top: 20px;">
                <!-- Pesanan akan dimuat di sini oleh JS -->
            </div>
        </div>

    </div>

    <script>
        // --- 1. LOGIKA SIMPAN PRODUK ---
        function simpanProduk() {
            const nama = document.getElementById('admin-nama').value;
            const harga = document.getElementById('admin-harga').value;
            const deskripsi = document.getElementById('admin-deskripsi').value;
            const gambar = document.getElementById('admin-gambar').value;
            const video = document.getElementById('admin-video').value;

            if (!nama || !harga || !deskripsi || !gambar) {
                alert("Mohon lengkapi minimal Nama, Harga, Deskripsi, dan Gambar Produk!");
                return;
            }

            const produkBaru = {
                nama: nama,
                harga: Number(harga),
                deskripsi: deskripsi,
                gambar: gambar,
                video: video
            };

            let dataProduk = JSON.parse(localStorage.getItem('dataProduk')) || [];
            dataProduk.push(produkBaru);
            localStorage.setItem('dataProduk', JSON.stringify(dataProduk));

            alert("Berhasil! Produk telah ditambahkan. Silakan cek halaman pembeli.");
            
            // Kosongkan form
            document.getElementById('admin-nama').value = '';
            document.getElementById('admin-harga').value = '';
            document.getElementById('admin-deskripsi').value = '';
            document.getElementById('admin-gambar').value = '';
            document.getElementById('admin-video').value = '';
        }

        // --- 2. LOGIKA MANAJEMEN PESANAN ---
        function muatPesananUser() {
            let pesanan = JSON.parse(localStorage.getItem('dataPesanan')) || [];
            const container = document.getElementById('list-pesanan-admin');
            container.innerHTML = '';

            if (pesanan.length === 0) {
                container.innerHTML = '<p style="color: #64748b;">Belum ada pesanan dari pelanggan.</p>';
                return;
            }

            pesanan.forEach(order => {
                let btnAtauStatus = '';
                
                if (order.status === "Menunggu Konfirmasi") {
                    btnAtauStatus = `<button class="btn-konfirmasi" onclick="konfirmasiPesanan('${order.id}')">✅ Konfirmasi Pesanan</button>`;
                } else {
                    btnAtauStatus = `<span class="status-ok">✔️ Pesanan Dikonfirmasi</span>`;
                }

                container.innerHTML += `
                    <div class="pesanan-card">
                        <div class="pesanan-header">
                            <strong style="color: #0f172a;">ID: ${order.id}</strong>
                            <span style="font-size: 14px; font-weight:bold; color: #ef4444;">${order.total}</span>
                        </div>
                        <p style="margin: 5px 0;"><strong>Penerima:</strong> ${order.namaPembeli} (${order.noWa})</p>
                        <p style="margin: 5px 0;"><strong>Alamat:</strong> ${order.alamatTujuan}</p>
                        <p style="margin: 5px 0;"><strong>Produk:</strong> ${order.produk}</p>
                        ${btnAtauStatus}
                    </div>
                `;
            });
        }

        function konfirmasiPesanan(idPesanan) {
            let pesanan = JSON.parse(localStorage.getItem('dataPesanan')) || [];
            let index = pesanan.findIndex(p => p.id === idPesanan);
            
            if (index !== -1) {
                pesanan[index].status = "Pesanan sudah di konfirmasi admin";
                localStorage.setItem('dataPesanan', JSON.stringify(pesanan));
                alert(`Berhasil! Pesanan ${idPesanan} telah dikonfirmasi.`);
                muatPesananUser(); // Segarkan tampilan admin
            }
        }

        // Panggil otomatis saat admin.html dibuka
        window.addEventListener('load', muatPesananUser);
    </script>
</body>
</html>
