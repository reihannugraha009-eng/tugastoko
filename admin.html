
<!-- Contoh Struktur Form di admin.html -->
<div class="area-kerja-admin">
    <label>Nama Produk:</label>
    <input type="text" id="admin-nama" placeholder="Contoh: Laptop UltraBook Pro">

    <label>Harga Produk (Angka Saja):</label>
    <input type="number" id="admin-harga" placeholder="Contoh: 15000000">

    <label>Deskripsi Produk:</label>
    <textarea id="admin-deskripsi" placeholder="Masukkan deskripsi spesifikasi..."></textarea>

    <label>URL Gambar Produk:</label>
    <input type="text" id="admin-gambar" placeholder="Contoh: foto.jpg">

    <label>URL Video Produk:</label>
    <input type="text" id="admin-video" placeholder="Contoh: https://www.youtube.com/embed/xxxx">

    <button onclick="simpanProduk()">Simpan Produk ke Database</button>
</div>

<script>
    function simpanProduk() {
        // 1. Ambil data dari form
        const nama = document.getElementById('admin-nama').value;
        const harga = parseInt(document.getElementById('admin-harga').value);
        const deskripsi = document.getElementById('admin-deskripsi').value;
        const gambar = document.getElementById('admin-gambar').value;
        const video = document.getElementById('admin-video').value;

        if(!nama || !harga || !deskripsi || !gambar || !video) {
            alert("Mohon lengkapi semua data!");
            return;
        }

        // 2. Buat objek produk
        const produkBaru = { nama, harga, deskripsi, gambar, video };

        // 3. Ambil data lama dari localStorage (jika ada), jika tidak buat array kosong
        let daftarProduk = JSON.parse(localStorage.getItem('database_produk')) || [];

        // 4. Masukkan produk baru ke dalam array
        daftarProduk.push(produkBaru);

        // 5. Simpan kembali ke localStorage
        localStorage.setItem('database_produk', JSON.stringify(daftarProduk));

        alert("Produk " + nama + " berhasil ditambahkan!");
        
        // Bersihkan form
        document.getElementById('admin-nama').value = '';
        document.getElementById('admin-harga').value = '';
        document.getElementById('admin-deskripsi').value = '';
        document.getElementById('admin-gambar').value = '';
        document.getElementById('admin-video').value = '';
    }
</script>
