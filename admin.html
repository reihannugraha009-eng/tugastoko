
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin - GadgetStore System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0; padding: 0; color: #333;
        }
        header {
            background: #0f172a; color: white; text-align: center; padding: 20px 0; margin-bottom: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 40px 20px; }
        
        .back-btn {
            display: inline-block; color: #2563eb; text-decoration: none;
            font-weight: bold; margin-bottom: 20px; font-size: 14px;
        }
        .back-btn:hover { text-decoration: underline; }
        
        .card {
            background: white; border-radius: 12px; padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        .card h2 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        
        /* Form Styles */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; color: #334155; margin-bottom: 8px; font-size: 14px;}
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1;
            border-radius: 6px; box-sizing: border-box; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-submit {
            background-color: #22c55e; color: white; font-weight: bold; font-size: 16px;
            padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s;
        }
        .btn-submit:hover { background-color: #16a34a; }

        .btn-batal-edit {
            background-color: #ef4444; color: white; font-weight: bold; font-size: 16px;
            padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s;
            margin-top: 10px; display: none; /* Disembunyikan secara default */
        }
        .btn-batal-edit:hover { background-color: #dc2626; }
        
        /* Pesanan Styles */
        .pesanan-card {
            border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px;
            margin-bottom: 15px; background: #f8fafc;
        }
        .pesanan-header {
            display: flex; justify-content: space-between; border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 10px; margin-bottom: 10px;
        }
        .btn-konfirmasi {
            background-color: #22c55e; color: white; border: none; padding: 8px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .btn-konfirmasi:hover { background-color: #16a34a; }
        .status-ok { color: #166534; font-weight: bold; display: inline-block; margin-top: 10px; }

        /* Produk Grid Styles */
        .produk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .produk-card {
            border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px;
            background: #fff; text-align: center;
        }
        .produk-card img {
            width: 100%; height: 140px; object-fit: contain;
            border-bottom: 1px solid #e2e8f0; margin-bottom: 10px; padding-bottom: 10px;
            background-color: #f1f5f9; /* Background tambahan biar rapi */
        }
        .produk-card h4 { margin: 0 0 5px 0; font-size: 15px; color: #1e293b; }
        .produk-card .harga { color: #2563eb; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        .btn-edit {
            background-color: #f59e0b; color: white; border: none; padding: 8px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .btn-edit:hover { background-color: #d97706; }
    </style>
</head>
<body>

    <header>
        <h1>GadgetStore System</h1>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn">⬅ Kembali ke Menu Utama</a>
        
        <!-- BAGIAN 1: FORM TAMBAH/EDIT PRODUK -->
        <div class="card">
            <h2 id="judul-form">Area Kerja Admin</h2>
            <p id="deskripsi-form" style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Gunakan formulir ini untuk menambahkan inventaris produk baru.</p>
            
            <div class="form-group">
                <label>Nama Produk:</label>
                <input type="text" id="admin-nama" placeholder="Contoh: Laptop UltraBook Pro">
            </div>
            
            <div class="form-group">
                <label>Harga Produk (Rp):</label>
                <input type="number" id="admin-harga" placeholder="Contoh: 15000000">
            </div>
            
            <div class="form-group">
                <label>Deskripsi Produk:</label>
                <textarea id="admin-deskripsi" rows="3" placeholder="Masukkan deskripsi spesifikasi..."></textarea>
            </div>
            
            <div class="form-group">
                <label>URL Gambar Produk:</label>
                <input type="text" id="admin-gambar" placeholder="https://contoh-link-gambar.com/foto.jpg">
            </div>
            
            <div class="form-group">
                <label>URL Video Produk:</label>
                <input type="text" id="admin-video" placeholder="Contoh: https://www.youtube.com/embed/xxxx">
            </div>
            
            <button class="btn-submit" id="btn-simpan" onclick="simpanProduk()">Simpan Produk ke Database</button>
            <button class="btn-batal-edit" id="btn-batal" onclick="batalEdit()">Batal Edit</button>
        </div>

        <!-- BAGIAN 3: DAFTAR PRODUK YANG SUDAH DITAMBAHKAN -->
        <div class="card">
            <h2>🛒 Manajemen Produk Anda</h2>
            <div id="list-produk-admin" class="produk-grid">
                <!-- Produk akan dimuat di sini oleh JS -->
            </div>
        </div>

        <!-- BAGIAN 2: MANAJEMEN PESANAN MASUK -->
        <div class="card">
            <h2>📦 Manajemen Pesanan Masuk</h2>
            <div id="list-pesanan-admin" style="margin-top: 20px;">
                <!-- Pesanan akan dimuat di sini oleh JS -->
            </div>
        </div>

    </div>

    <script>
        let indexEdit = -1;

        // --- FITUR AUTO-LOAD 6 PRODUK BAWAAN ---
        function inisialisasiProdukAwal() {
            let isDefaultLoaded = localStorage.getItem('defaultLoaded');
            
            // Kalau belum pernah di-load, masukin 6 produk ini ke database
            if (!isDefaultLoaded) {
                const produkDefault = [
                    { nama: "Vivo X300 Pro", harga: 14000000, deskripsi: "Perdana dengan Dimensity 9500. Sangat cocok untuk kamu yang mencari hasil jepretan kamera setara DSLR.", gambar: "Screenshot 2026-08-11 123240.png ", video: "" },
                    { nama: "POCO X8 Pro Max", harga: 6000000, deskripsi: "Raja performa kelas menengah. Dilengkapi baterai 8500mAh dan HyperCharge 100W, bikin mabar makin lancar.", gambar: "Screenshot 2026-08-11 120704.png", video: "" },
                    { nama: "ROG Zephyrus DUO", harga: 130000000, deskripsi: "IN THIS ECONOMY!!??", gambar: "Screenshot 2026-08-11 141250.png", video: "" },
                    { nama: "Xiaomi 17T", harga: 8500000, deskripsi: "Performa gahar dengan kamera Leica. Cocok untuk fotografi profesional dan gaming berat dengan harga terjangkau.", gambar: "Screenshot 2026-08-11 123218.png", video: "" },
                    { nama: "Samsung Galaxy S26 Ultra", harga: 22000000, deskripsi: "HP Flagship terbaik dengan S-Pen dan teknologi AI canggih. Layar Dynamic AMOLED dan kamera superior.", gambar: "Screenshot 2026-08-11 123433.png", video: "" },
                    { nama: "Apple iPhone 17", harga: 16500000, deskripsi: "Generasi terbaru iPhone dengan performa chipset ngebut, desain elegan, dan integrasi ekosistem Apple yang mulus.", gambar: "Screenshot 2026-08-11 123311.png", video: "" }
                ];

                let dataProdukLama = JSON.parse(localStorage.getItem('dataProduk')) || [];
                
                // Gabungkan produk lama (seperti Tecno) dengan ke-6 produk bawaan di awal
                let gabunganProduk = [...produkDefault, ...dataProdukLama];
                
                localStorage.setItem('dataProduk', JSON.stringify(gabunganProduk));
                localStorage.setItem('defaultLoaded', 'true'); // Kasih tanda biar nggak ke-load dobel di kemudian hari
            }
        }

        // --- 1. LOGIKA SIMPAN & UPDATE PRODUK ---
        function simpanProduk() {
            const nama = document.getElementById('admin-nama').value;
            const harga = document.getElementById('admin-harga').value;
            const deskripsi = document.getElementById('admin-deskripsi').value;
            const gambar = document.getElementById('admin-gambar').value;
            const video = document.getElementById('admin-video').value;

            if (!nama || !harga || !deskripsi || !gambar) {
                alert("Mohon lengkapi minimal Nama, Harga, Deskripsi, dan Gambar Produk!");
                return;
            }

            const produkData = {
                nama: nama,
                harga: Number(harga),
                deskripsi: deskripsi,
                gambar: gambar,
                video: video
            };

            let dataProduk = JSON.parse(localStorage.getItem('dataProduk')) || [];

            if (indexEdit === -1) {
                dataProduk.push(produkData);
                alert("Berhasil! Produk telah ditambahkan.");
            } else {
                dataProduk[indexEdit] = produkData;
                alert("Berhasil! Data produk telah diperbarui.");
                batalEdit();
            }

            localStorage.setItem('dataProduk', JSON.stringify(dataProduk));
            kosongkanForm();
            muatDaftarProduk();
        }

        // --- 2. LOGIKA EDIT PRODUK ---
        function editProduk(index) {
            let dataProduk = JSON.parse(localStorage.getItem('dataProduk')) || [];
            let produkPilihan = dataProduk[index];

            document.getElementById('admin-nama').value = produkPilihan.nama;
            document.getElementById('admin-harga').value = produkPilihan.harga;
            document.getElementById('admin-deskripsi').value = produkPilihan.deskripsi;
            document.getElementById('admin-gambar').value = produkPilihan.gambar;
            document.getElementById('admin-video').value = produkPilihan.video;

            indexEdit = index;
            document.getElementById('judul-form').innerText = "Edit Produk";
            document.getElementById('judul-form').style.color = "#f59e0b";
            document.getElementById('deskripsi-form').innerText = "Silakan perbaiki typo atau detail produk di bawah ini.";
            document.getElementById('btn-simpan').innerText = "Update Produk";
            document.getElementById('btn-batal').style.display = "block";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 3. LOGIKA BATAL EDIT ---
        function batalEdit() {
            indexEdit = -1;
            kosongkanForm();
            document.getElementById('judul-form').innerText = "Area Kerja Admin";
            document.getElementById('judul-form').style.color = "#0f172a";
            document.getElementById('deskripsi-form').innerText = "Gunakan formulir ini untuk menambahkan inventaris produk baru.";
            document.getElementById('btn-simpan').innerText = "Simpan Produk ke Database";
            document.getElementById('btn-batal').style.display = "none";
        }

        function kosongkanForm() {
            document.getElementById('admin-nama').value = '';
            document.getElementById('admin-harga').value = '';
            document.getElementById('admin-deskripsi').value = '';
            document.getElementById('admin-gambar').value = '';
            document.getElementById('admin-video').value = '';
        }

        // --- 4. TAMPILKAN DAFTAR PRODUK ---
        function muatDaftarProduk() {
            let dataProduk = JSON.parse(localStorage.getItem('dataProduk')) || [];
            const container = document.getElementById('list-produk-admin');
            container.innerHTML = '';

            if (dataProduk.length === 0) {
                container.innerHTML = '<p style="color: #64748b;">Belum ada produk yang ditambahkan. Silakan isi form di atas.</p>';
                return;
            }

            dataProduk.forEach((produk, index) => {
                container.innerHTML += `
                    <div class="produk-card">
                        <img src="${produk.gambar}" alt="${produk.nama}" onerror="this.src='https://dummyimage.com/300x200/cbd5e1/1e293b.png&text=Gambar+Rusak'">
                        <h4>${produk.nama}</h4>
                        <div class="harga">Rp ${produk.harga.toLocaleString('id-ID')}</div>
                        <button class="btn-edit" onclick="editProduk(${index})">✏️ Edit Produk</button>
                    </div>
                `;
            });
        }

        // --- 5. LOGIKA MANAJEMEN PESANAN ---
        function muatPesananUser() {
            let pesanan = JSON.parse(localStorage.getItem('dataPesanan')) || [];
            const container = document.getElementById('list-pesanan-admin');
            container.innerHTML = '';

            if (pesanan.length === 0) {
                container.innerHTML = '<p style="color: #64748b;">Belum ada pesanan dari pelanggan.</p>';
                return;
            }

            pesanan.forEach(order => {
                let btnAtauStatus = '';
                
                if (order.status === "Menunggu Konfirmasi") {
                    btnAtauStatus = `<button class="btn-konfirmasi" onclick="konfirmasiPesanan('${order.id}')">✅ Konfirmasi Pesanan</button>`;
                } else {
                    btnAtauStatus = `<span class="status-ok">✔️ Pesanan Dikonfirmasi</span>`;
                }

                container.innerHTML += `
                    <div class="pesanan-card">
                        <div class="pesanan-header">
                            <strong style="color: #0f172a;">ID: ${order.id}</strong>
                            <span style="font-size: 14px; font-weight:bold; color: #ef4444;">${order.total}</span>
                        </div>
                        <p style="margin: 5px 0;"><strong>Penerima:</strong> ${order.namaPembeli} (${order.noWa})</p>
                        <p style="margin: 5px 0;"><strong>Alamat:</strong> ${order.alamatTujuan}</p>
                        <p style="margin: 5px 0;"><strong>Produk:</strong> ${order.produk}</p>
                        ${btnAtauStatus}
                    </div>
                `;
            });
        }

        function konfirmasiPesanan(idPesanan) {
            let pesanan = JSON.parse(localStorage.getItem('dataPesanan')) || [];
            let index = pesanan.findIndex(p => p.id === idPesanan);
            
            if (index !== -1) {
                pesanan[index].status = "Pesanan sudah di konfirmasi admin";
                localStorage.setItem('dataPesanan', JSON.stringify(pesanan));
                alert(`Berhasil! Pesanan ${idPesanan} telah dikonfirmasi.`);
                muatPesananUser(); 
            }
        }

        // Panggil otomatis saat web admin dibuka!
        window.addEventListener('load', function() {
            inisialisasiProdukAwal(); // Load 6 produk di awal
            muatPesananUser();
            muatDaftarProduk(); 
        });
    </script>
</body>
</html>
