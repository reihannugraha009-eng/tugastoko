
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - GadgetStore</title>
</head>
<body>

    <!-- Bagian Header -->
    <header>
        <h1 align="center">GadgetStore System</h1>
    </header>

    <hr>

    <!-- Bagian Konten Utama -->
    <main>
        <a href="index.html">← Kembali ke Menu Utama</a>
        
        <section>
            <h2>Area Kerja Admin</h2>
            <p>Gunakan formulir ini untuk menambahkan inventaris produk baru.</p>
            
            <!-- Form Input Produk -->
            <form action="" method="POST">
                
                <p>
                    <label for="nama_produk"><b>Nama Produk:</b></label><br>
                    <input type="text" id="nama_produk" name="nama_produk" placeholder="Contoh: Laptop UltraBook Pro" size="50" required>
                </p>

                <p>
                    <label for="deskripsi_harga"><b>Deskripsi & Harga Produk:</b></label><br>
                    <textarea id="deskripsi_harga" name="deskripsi_harga" placeholder="Masukkan deskripsi spesifikasi dan harga..." rows="5" cols="52" required></textarea>
                </p>

                <p>
                    <label for="url_gambar"><b>URL Gambar Produk:</b></label><br>
                    <input type="url" id="url_gambar" name="url_gambar" placeholder="https://contoh-link-gambar.com/foto.jpg" size="50" required>
                </p>

                <p>
                    <label for="url_video"><b>URL Video Produk:</b></label><br>
                    <input type="url" id="url_video" name="url_video" placeholder="Contoh: https://www.youtube.com/embed/xxxx" size="50" required>
                </p>

                <p>
                    <button type="submit"><b>Simpan Produk ke Database</b></button>
                </p>

            </form>
        </section>
    </main>

</body>
</html>
