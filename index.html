
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore System</title>
    <style>
        /* Import Font dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            /* Background gradasi modern */
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .main-card {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .main-card h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
        }

        .main-card p {
            color: #64748b;
            font-size: 14px;
            margin-top: 8px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* Container untuk 2 tombol */
        .menu-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        /* Styling dasar tombol kotak */
        .menu-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            text-decoration: none;
            color: #334155;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .menu-box .icon {
            font-size: 45px;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .menu-box .text {
            font-weight: 600;
            font-size: 15px;
        }

        /* Efek Hover untuk masing-masing tombol */
        .menu-box.admin:hover {
            border-color: #4f46e5;
            background-color: #eef2ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.15);
        }
        .menu-box.admin:hover .icon {
            transform: scale(1.1);
        }

        .menu-box.pembeli:hover {
            border-color: #10b981;
            background-color: #ecfdf5;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.15);
        }
        .menu-box.pembeli:hover .icon {
            transform: scale(1.1);
        }

        /* Audio Player di bawah */
        .audio-wrapper {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px dashed #cbd5e1;
        }
        
        audio {
            width: 100%;
            height: 35px;
            outline: none;
        }
        
        .audio-teks {
            font-size: 11px;
            color: #94a3b8;
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>GadgetStore Pro</h1>
        <p>Platform E-Commerce Gadget & Aksesoris Terlengkap Masa Kini</p>

        <div class="menu-container">
            <!-- TOMBOL ADMIN SUDAH DIUBAH BIAR MINTA PASSWORD -->
            <a href="#" onclick="loginAdmin(event)" class="menu-box admin">
                <div class="icon">🛠️</div>
                <div class="text">Admin Toko</div>
            </a>

            <!-- Tombol Pembeli -->
            <a href="user.html" class="menu-box pembeli">
                <div class="icon">🛍️</div>
                <div class="text">Pembeli</div>
            </a>
        </div>

        <!-- Audio Player -->
        <div class="audio-wrapper">
            <audio controls autoplay loop>
                <source src="sound.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung elemen audio.
            </audio>
            <div class="audio-teks">*Putar musik untuk pengalaman terbaik</div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA LOGIN -->
    <script>
        function loginAdmin(event) {
            // Mencegah link langsung pindah halaman
            event.preventDefault(); 

            // Munculin pop-up minta Username
            const user = prompt("Silakan masukkan Username Admin:");
            
            // Kalau diklik Cancel, batalkan proses
            if (user === null) return; 

            // Cek Username
            if (user === "admin") {
                // Munculin pop-up minta Password
                const pass = prompt("Masukkan Password:");
                
                // Cek Password
                if (pass === "qwerty123") {
                    alert("Login Berhasil! Selamat datang Bos.");
                    window.location.href = "admin.html"; // Baru deh pindah ke admin
                } else if (pass !== null) {
                    alert("Akses Ditolak! Password salah.");
                }
            } else {
                alert("Akses Ditolak! Username tidak terdaftar.");
            }
        }
    </script>
</body>
</html>
