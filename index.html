
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore System</title>
    <style>
        /* Import Font dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            /* Background gradasi modern */
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .main-card {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .main-card h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
        }

        .main-card p {
            color: #64748b;
            font-size: 14px;
            margin-top: 8px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* Container untuk 2 tombol */
        .menu-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        /* Styling dasar tombol kotak */
        .menu-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            text-decoration: none;
            color: #334155;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .menu-box .icon {
            font-size: 45px;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .menu-box .text {
            font-weight: 600;
            font-size: 15px;
        }

        /* Efek Hover untuk masing-masing tombol */
        .menu-box.admin:hover {
            border-color: #4f46e5;
            background-color: #eef2ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.15);
        }
        .menu-box.admin:hover .icon {
            transform: scale(1.1);
        }

        .menu-box.pembeli:hover {
            border-color: #10b981;
            background-color: #ecfdf5;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.15);
        }
        .menu-box.pembeli:hover .icon {
            transform: scale(1.1);
        }

        /* Audio Player di bawah */
        .audio-wrapper {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px dashed #cbd5e1;
        }
        
        audio {
            width: 100%;
            height: 35px;
            outline: none;
        }
        
        .audio-teks {
            font-size: 11px;
            color: #94a3b8;
            font-style: italic;
            margin-top: 5px;
        }

        /* ========================================= */
        /* STYLING UNTUK KOTAK LOGIN (MODAL)         */
        /* ========================================= */
        .modal-overlay {
            display: none; /* Disembunyikan awalnya */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-box h2 {
            margin-top: 0;
            font-size: 20px;
            color: #1e293b;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-box label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .btn-login:hover { background-color: #4338ca; }

        .btn-batal {
            width: 100%;
            padding: 12px;
            background-color: #f1f5f9;
            color: #64748b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-batal:hover { background-color: #e2e8f0; }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
            display: none; /* Disembunyikan awalnya */
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>GadgetStore Pro</h1>
        <p>Platform E-Commerce Gadget & Aksesoris Terlengkap Masa Kini</p>

        <div class="menu-container">
            <!-- Tombol Admin (Sekarang memanggil pop-up/modal login) -->
            <a href="#" onclick="bukaModalLogin(event)" class="menu-box admin">
                <div class="icon">🛠️</div>
                <div class="text">Admin Toko</div>
            </a>

            <!-- Tombol Pembeli -->
            <a href="user.html" class="menu-box pembeli">
                <div class="icon">🛍️</div>
                <div class="text">Pembeli</div>
            </a>
        </div>

        <!-- Audio Player -->
        <div class="audio-wrapper">
            <audio controls autoplay loop>
                <source src="sound.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung elemen audio.
            </audio>
            <div class="audio-teks">*Putar musik untuk pengalaman terbaik</div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- KOTAK LOGIN (MODAL) YANG MUNCUL SAAT KLIK -->
    <!-- ========================================= -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>Masuk sebagai Admin</h2>
            
            <div class="error-msg" id="pesanError">Username atau Password salah!</div>

            <label>Username</label>
            <input type="text" id="inputUsername" placeholder="Masukkan username admin">

            <label>Password</label>
            <input type="password" id="inputPassword" placeholder="Masukkan password">

            <button class="btn-login" onclick="prosesLogin()">Login Sekarang</button>
            <button class="btn-batal" onclick="tutupModalLogin()">Batal</button>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT UNTUK LOGIKA LOGIN -->
    <script>
        // Fungsi untuk memunculkan kotak login
        function bukaModalLogin(event) {
            event.preventDefault(); // Mencegah link refresh halaman
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('pesanError').style.display = 'none'; // Sembunyikan pesan error
            document.getElementById('inputUsername').value = ''; // Kosongkan input
            document.getElementById('inputPassword').value = ''; 
        }

        // Fungsi untuk menutup kotak login
        function tutupModalLogin() {
            document.getElementById('loginModal').style.display = 'none';
        }

        // Fungsi untuk mengecek username dan password
        function prosesLogin() {
            const user = document.getElementById('inputUsername').value;
            const pass = document.getElementById('inputPassword').value;
            const pesanError = document.getElementById('pesanError');

            // Cek kecocokan data
            if (user === "admin" && pass === "qwerty123") {
                // Kalau bener, langsung pindah ke halaman admin
                window.location.href = "admin.html"; 
            } else {
                // Kalau salah, munculin tulisan merah
                pesanError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
